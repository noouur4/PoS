<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffe Shop</title>
    <link rel="preconnect" href="https://googleapis.com/" />
    <link rel="preconnect" href="https://gstatic.com/" crossorigin />
    <link
      href="https://googleapis.com/css2?family=Comfortaa:wght@300..700&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header
      class="shadow-sm py-3 px-4 text-white"
      style="background-color: #2b1f1a"
    >
      <div
        class="container-fluid d-flex justify-content-between align-items-center"
      >
        <!-- Left: Store Title & Register Info -->
        <div class="d-flex align-items-center gap-3">
          <h4 class="mb-0 fw-bold text-white fs-5">Coffee Shop ☕️</h4>
          <span class="text-white-50">|</span>
          <div class="d-flex align-items-center">
            <span
              class="text-success me-2"
              style="
                font-size: 10px;
                filter: drop-shadow(0 0 4px rgba(34, 197, 94, 0.8));
              "
              >●</span
            >
            <span class="fw-semibold text-white fs-6 me-2">Register #01</span>
            <span class="text-white-50 me-2">•</span>
            <span class="text-white-50 fs-6">Main Market</span>
          </div>
        </div>

        <!-- Right: Live Clock -->
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-clock text-white-50"></i>
          <span
            id="liveClock"
            class="font-monospace text-white fw-bold fs-6"
            style="letter-spacing: 1px"
            >--:--:-- --</span
          >
        </div>
      </div>
    </header>
    <div class="container-xl py-5">
      <div class="row g-4">
        <!-- Left: Cart & Order Summary Panel -->
        <div class="col-12 col-lg-4">
          <div class="card cart-panel shadow-sm">
            <div class="card-body p-4 d-flex flex-column">
              <h6 class="category mb-1">Your Order</h6>
              <h5 class="card-title mb-3">Current Cart</h5>

              <!-- Empty Cart Message (Requirement B.6) -->
              <div id="emptyCartMsg" class="text-muted text-center py-4">
                <i class="bi bi-cart-x fs-2 d-block mb-2"></i>
                No products have been selected.
              </div>

              <!-- Itemized Order List (Requirement B.2, B.3) -->
              <div
                id="cartItemsList"
                class="flex-grow-1 overflow-auto mb-3"
                style="max-height: 350px"
              >
                <!-- Dynamically populated via JavaScript -->
              </div>

              <!-- Totals Section (Requirement C) -->
              <div class="border-top pt-3 mt-auto">
                <div class="d-flex justify-content-between mb-1">
                  <span>Total Items</span>
                  <strong id="grandCount">0</strong>
                </div>
                <div class="d-flex justify-content-between mb-3">
                  <span>Final Amount</span>
                  <strong id="grandTotal" class="fs-5 text-success"
                    >$0.00</strong
                  >
                </div>

                <!-- Action Buttons -->
                <button
                  id="completeSaleBtn"
                  type="button"
                  class="btn btn-success w-100 mb-2"
                  disabled
                >
                  Complete Sale / Pay
                </button>
                <button
                  id="clearBtn"
                  type="button"
                  class="btn btn-outline-secondary w-100"
                >
                  Clear Order
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Right: Product Selection Cards (6 Products with New Design) -->
        <div class="col-12 col-lg-8">
          <!-- Right: Product Selection Cards (6 Products with New Design) -->
          <!-- Category Filter Buttons -->
          <div
            class="d-flex gap-2 mb-4 overflow-x-auto pb-2"
            id="categoryFilters"
          >
            <button
              type="button"
              class="btn filter-btn rounded-pill px-4"
              data-category="All"
            >
              All
            </button>
            <button
              type="button"
              class="btn filter-btn rounded-pill px-4"
              data-category="Beverages"
            >
              Beverages
            </button>
            <button
              type="button"
              class="btn filter-btn rounded-pill px-4"
              data-category="Bakery"
            >
              Bakery
            </button>
            <button
              type="button"
              class="btn filter-btn rounded-pill px-4"
              data-category="Sandwiches"
            >
              Sandwiches
            </button>
            <button
              type="button"
              class="btn filter-btn rounded-pill px-4"
              data-category="Salads"
            >
              Salads
            </button>
          </div>
          <div
            class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4"
            id="menuContainer"
          >
            <!-- JavaScript will inject the product cards here automatically -->
          </div>
        </div>
      </div>
    </div>

    <!-- Receipt / Complete Sale Modal (Requirement E) -->
    <div class="modal fade" id="receiptModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Order Receipt / Summary</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p class="text-muted text-center mb-3">
              Thank you for your purchase!
            </p>
            <div id="receiptContent" class="border-bottom pb-3 mb-3"></div>
            <div class="d-flex justify-content-between fs-5 fw-bold">
              <span>Total Paid:</span>
              <span id="receiptTotal">$0.00</span>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-primary w-100"
              id="newOrderBtn"
              data-bs-dismiss="modal"
            >
              Start New Order
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="cancelModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Cancel Order</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            Are you sure you want to cancel this order?
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              No, keep order
            </button>
            <button type="button" class="btn btn-danger" id="confirmCancelBtn">
              Yes, cancel order
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js" defer></script>
  </body>
</html>
